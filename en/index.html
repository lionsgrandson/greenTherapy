<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173c2b" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <link rel="icon" href="/assets/green-therapy-logo.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Green Therapy | Wellness &amp; Wellbeing for company events</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.GREEN_THERAPY_CONFIG = window.GREEN_THERAPY_CONFIG || { googleAnalyticsId: "" };
    window.ACCESSIBILITY_WIDGET_CONFIG = {
      enableVoiceControl: false,
      enableScreenReader: true,
      enableHighContrast: true,
      enableBiggerText: true,
      enableTextSpacing: true,
      enablePauseAnimations: true,
      enableHideImages: true,
      enableDyslexiaFont: true,
      enableBiggerCursor: true,
      enableLineHeight: true,
      widgetPosition: { side: "left", left: "16px", bottom: "16px" },
      lang: location.pathname.startsWith("/en") ? {} : {
        accessibilityMenu: "תפריט נגישות",
        closeAccessibilityMenu: "סגירת תפריט נגישות",
        accessibilityTools: "כלי נגישות",
        resetAllSettings: "איפוס הגדרות",
        screenReader: "קורא מסך",
        highContrast: "ניגודיות גבוהה",
        biggerText: "טקסט גדול",
        textSpacing: "ריווח טקסט",
        pauseAnimations: "עצירת אנימציות",
        hideImages: "הסתרת תמונות",
        dyslexiaFriendly: "גופן ידידותי לדיסלקציה",
        biggerCursor: "סמן גדול",
        lineHeight: "גובה שורה",
        textAlign: "יישור טקסט",
        textSize: "גודל טקסט"
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/accessibility-widgets@latest/widget.js" defer></script>
  <script type="module" src="/src/main.jsx"></script>

</html>
