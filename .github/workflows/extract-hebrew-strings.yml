name: Extract Hebrew strings
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_hebrew_strings.py'
      - '.github/workflows/extract-hebrew-strings.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract strings
        run: python3 scripts/extract_hebrew_strings.py
      - name: Commit report
        run: |
          git config user.name "Moshe Schwartzberg"
          git config user.email "43815731+lionsgrandson@users.noreply.github.com"
          git add hebrew-strings.txt
          git diff --cached --quiet && exit 0
          git commit -m "Extract Hebrew strings for English mirror"
          git push
