name: Patch English localization
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_english_localization.py'
      - '.github/workflows/patch-english-localization.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch generator
        run: python3 scripts/patch_english_localization.py
      - name: Rebuild English pages
        run: python3 scripts/build_english_mirror.py
      - name: Verify English localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=['index.html','spa.html','ice-bath.html','workshops.html','healthy-bar.html','about.html','gallery.html','contact.html']
          for p in pages:
              text=Path('en',p).read_text(encoding='utf-8')
              if 'dir="ltr"' not in text.split('</head>',1)[0]: raise SystemExit(f'{p}: not LTR')
              if '../english.css' not in text: raise SystemExit(f'{p}: english.css missing')
              if 'gt-en-page' not in text: raise SystemExit(f'{p}: English page class missing')
          home=Path('en/index.html').read_text(encoding='utf-8')
          if 'gt-en-hero-copy' not in home: raise SystemExit('Home hero width refinement missing')
          print('English localization checks passed')
          PY
      - name: Commit localization fixes
        run: |
          git config user.name "Moshe Schwartzberg"
          git config user.email "43815731+lionsgrandson@users.noreply.github.com"
          git add scripts/build_english_mirror.py en translations-he-en.json
          git diff --cached --quiet && exit 0
          git commit -m "Refine English LTR layout and spacing"
          git push
