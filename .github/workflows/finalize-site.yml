name: Finalize Green Therapy refinements

on:
  push:
    branches: [main]
    paths:
      - '.site-update/**'
      - '.github/workflows/finalize-site.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply design refinements and build language pages
        run: |
          python -m pip install --quiet beautifulsoup4
          mkdir -p assets
          base64 -d .site-update/cm1_small.b64 > assets/client-message-1.jpg
          base64 -d .site-update/cm2_small.b64 > assets/client-message-2.jpg
          python .site-update/site_update.py
          rm -rf .site-update
          rm -f .github/workflows/finalize-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Refine Stitch design, add motion and English pages"
          git push
