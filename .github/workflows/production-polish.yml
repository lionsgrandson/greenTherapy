name: Production polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-polish.yml'

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Clean production-facing HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          pages = [
              'index.html','spa.html','ice-bath.html','workshops.html',
              'healthy-bar.html','about.html','gallery.html','contact.html'
          ]

          def remove_placeholder_privacy(text: str) -> str:
              text = re.sub(r'\s*<li[^>]*>\s*<(?:a|span)[^>]*>\s*Privacy Policy\s*</(?:a|span)>\s*</li>', '', text, flags=re.I)
              text = re.sub(r'\s*<div class="pt-2">\s*<(?:a|span)[^>]*>\s*Privacy Policy\s*</(?:a|span)>\s*</div>', '', text, flags=re.I)
              text = re.sub(r'\s*<(?:a|span)[^>]*>\s*Privacy Policy\s*</(?:a|span)>', '', text, flags=re.I)
              return text

          def remove_adjacent_duplicate_email(text: str) -> str:
              # Collapse any run of 2+ adjacent plain email paragraphs to one.
              pattern = re.compile(
                  r'(<p[^>]*>\s*alongreentherapy@gmail\.com\s*</p>)(?:\s*<p[^>]*>\s*alongreentherapy@gmail\.com\s*</p>)+',
                  re.I
              )
              return pattern.sub(r'\1', text)

          for page in pages:
              p = Path(page)
              s = p.read_text(encoding='utf-8')
              s = remove_placeholder_privacy(s)
              s = remove_adjacent_duplicate_email(s)
              s = s.replace('bg-[#372f28]', 'bg-[#1d3326]')
              p.write_text(s, encoding='utf-8')

          p = Path('contact.html')
          s = p.read_text(encoding='utf-8')
          leaked = ' Links Column (Mandated strings from JSON: "Pop-Up Spa", "Mind &amp; Body Workshops", "Ice Bath Experience", "Privacy Policy") '
          s = s.replace(leaked, '<!-- Service links -->')
          s = s.replace(
              '<footer class="full-width py-12 bg-primary text-surface-bone">',
              '<footer class="full-width py-12 bg-[#1d3326] text-[#f2e8d5]">'
          )

          if '<footer' in s:
              head, footer = s.split('<footer', 1)
              footer = footer.replace('text-surface-bone/80', 'text-[#f2e8d5]/80')
              footer = footer.replace('text-surface-bone/60', 'text-[#f2e8d5]/60')
              footer = footer.replace('text-surface-bone', 'text-[#f2e8d5]')
              s = head + '<footer' + footer

          # No participant range or service is chosen for the visitor.
          s = s.replace(' checked=""', '')
          s = s.replace(
              '<input class="sr-only peer" name="participants" type="radio" value="10-30"/>',
              '<input class="sr-only peer" name="participants" required="" type="radio" value="10-30"/>'
          )

          field_names = {
              'fullName': ('fullName', 'name'),
              'companyName': ('companyName', 'organization'),
              'role': ('role', ''),
              'phone': ('phone', 'tel'),
              'email': ('email', 'email'),
              'eventDate': ('eventDate', ''),
              'locationType': ('locationType', ''),
              'specialNotes': ('specialNotes', ''),
          }
          for field_id, (name, autocomplete) in field_names.items():
              pattern = rf'(<(?:input|select|textarea)\b[^>]*\bid="{re.escape(field_id)}")'
              def add_attrs(m, name=name, autocomplete=autocomplete):
                  tag_start = m.group(1)
                  if re.search(r'\bname=', tag_start):
                      return tag_start
                  extra = f' name="{name}"'
                  if autocomplete:
                      extra += f' autocomplete="{autocomplete}"'
                  return tag_start + extra
              s = re.sub(pattern, add_attrs, s, count=1)

          p.write_text(s, encoding='utf-8')

          # Ice bath form: no real group size selected by default.
          p = Path('ice-bath.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<option selected="">25-60 משתתפים (מחלקתי / Offsite)</option>', '<option>25-60 משתתפים (מחלקתי / Offsite)</option>')
          marker = 'id="group-size">\n<option>10-25 משתתפים (צוות אינטימי)</option>'
          replacement = 'id="group-size" name="groupSize" required="">\n<option disabled="" selected="" value="">בחרו כמות משתתפים</option>\n<option>10-25 משתתפים (צוות אינטימי)</option>'
          if marker not in s:
              raise SystemExit('Could not find ice-bath group-size selector; refusing a blind patch')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')

          cache_path = Path('translations-he-en.json')
          cache = json.loads(cache_path.read_text(encoding='utf-8'))
          cache['בחרו כמות משתתפים'] = 'Choose participant range'
          cache_path.write_text(json.dumps(cache, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          PY

      - name: Rebuild English mirror
        run: python3 scripts/build_english_mirror.py

      - name: Production-facing validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              'index.html','spa.html','ice-bath.html','workshops.html',
              'healthy-bar.html','about.html','gallery.html','contact.html'
          ]
          all_pages = pages + [f'en/{p}' for p in pages]

          for page in all_pages:
              s = Path(page).read_text(encoding='utf-8')
              if 'Mandated strings' in s or 'Links Column (' in s:
                  raise SystemExit(f'{page}: leaked design/developer annotation')
              if 'Privacy Policy' in s:
                  raise SystemExit(f'{page}: non-functional Privacy Policy placeholder remains')
              if 'checked=""' in s:
                  raise SystemExit(f'{page}: a form choice is still pre-checked')

              for m in re.finditer(r'<option\b[^>]*selected=""[^>]*>', s, flags=re.I):
                  tag = m.group(0)
                  if 'value=""' not in tag:
                      raise SystemExit(f'{page}: real option still preselected: {tag}')

              if re.search(r'<p[^>]*>\s*alongreentherapy@gmail\.com\s*</p>\s*<p[^>]*>\s*alongreentherapy@gmail\.com\s*</p>', s, flags=re.I):
                  raise SystemExit(f'{page}: duplicate adjacent email remains')

          contact = Path('contact.html').read_text(encoding='utf-8')
          if 'bg-[#1d3326]' not in contact.split('<footer', 1)[1]:
              raise SystemExit('contact.html: footer is not using the forest green')
          if 'name="participants" required=""' not in contact:
              raise SystemExit('contact.html: participant choice is not explicitly user-selected/required')

          ice = Path('ice-bath.html').read_text(encoding='utf-8')
          if 'בחרו כמות משתתפים' not in ice:
              raise SystemExit('ice-bath.html: neutral participant placeholder missing')

          print('Production-facing cleanup validation passed')
          PY

      - name: Commit cleanup and remove temporary workflow
        run: |
          rm -f .github/workflows/production-polish.yml
          git config user.name "Moshe Schwartzberg"
          git config user.email "43815731+lionsgrandson@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Polish production footers and clear form defaults"
          git push
