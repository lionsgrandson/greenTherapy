name: Fix English mirror direction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-english-direction.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix English lang and direction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('en').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              def fix_tag(m):
                  tag=m.group(0)
                  if re.search(r'\blang="[^"]*"', tag, re.I):
                      tag=re.sub(r'\blang="[^"]*"', 'lang="en"', tag, count=1, flags=re.I)
                  else:
                      tag=tag[:-1]+' lang="en">'
                  if re.search(r'\bdir="[^"]*"', tag, re.I):
                      tag=re.sub(r'\bdir="[^"]*"', 'dir="ltr"', tag, count=1, flags=re.I)
                  else:
                      tag=tag[:-1]+' dir="ltr">'
                  return tag
              s=re.sub(r'<html\b[^>]*>', fix_tag, s, count=1, flags=re.I)
              p.write_text(s, encoding='utf-8')

          # Make the mirror builder robust to html tags that have class attributes before dir/lang.
          p=Path('scripts/build_english_mirror.py')
          s=p.read_text(encoding='utf-8')
          old='''    out = re.sub(r'<html\\s+dir="rtl"\\s+lang="he"', '<html dir="ltr" lang="en"', out, count=1, flags=re.I)\n    out = re.sub(r'<html\\s+lang="he"\\s+dir="rtl"', '<html dir="ltr" lang="en"', out, count=1, flags=re.I)'''
          new='''    def html_tag_cb(m):\n        tag = m.group(0)\n        if re.search(r'\\blang="[^"]*"', tag, re.I):\n            tag = re.sub(r'\\blang="[^"]*"', 'lang="en"', tag, count=1, flags=re.I)\n        else:\n            tag = tag[:-1] + ' lang="en">'\n        if re.search(r'\\bdir="[^"]*"', tag, re.I):\n            tag = re.sub(r'\\bdir="[^"]*"', 'dir="ltr"', tag, count=1, flags=re.I)\n        else:\n            tag = tag[:-1] + ' dir="ltr">'\n        return tag\n    out = re.sub(r'<html\\b[^>]*>', html_tag_cb, out, count=1, flags=re.I)'''
          if old not in s:
              raise SystemExit('Expected builder direction block not found')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "Moshe Schwartzberg"
          git config user.email "43815731+lionsgrandson@users.noreply.github.com"
          rm -f .github/workflows/fix-english-direction.yml
          git add -A
          git commit -m "Fix English mirror LTR document settings"
          git push
