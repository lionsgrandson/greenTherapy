name: Validate Green Therapy SEO
on:
  push:
    branches: [main]
  pull_request:
jobs:
  seo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/seo-audit.mjs
      - run: node --check shared-components.js && node --check copy-overrides.js
