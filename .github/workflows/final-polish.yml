name: Final site polish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/final-polish.yml'
      - 'scripts/final_polish.py'

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish
        run: python3 scripts/final_polish.py
      - name: Commit changes
        run: |
          git config user.name "Moshe Schwartzberg"
          git config user.email "43815731+lionsgrandson@users.noreply.github.com"
          rm -f .github/workflows/final-polish.yml scripts/final_polish.py
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Polish contact details and internal links"
          git push
