name: Finalize English layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-english-layout.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Finalize generator and clean temporary patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_english_mirror.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("tag = tag[:-1] + ' dir=\"rtl\">'", "tag = tag[:-1] + ' dir=\"ltr\">'")
          p.write_text(s, encoding='utf-8')
          PY
          rm -f scripts/patch_english_localization.py
          rm -f .github/workflows/patch-english-localization.yml
          rm -f .github/workflows/finalize-english-layout.yml
      - name: Commit cleanup
        run: |
          git config user.name "Moshe Schwartzberg"
          git config user.email "43815731+lionsgrandson@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize English LTR localization"
          git push
