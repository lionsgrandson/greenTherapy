name: Apply Green Therapy content

on:
  push:
    branches: [main]
    paths:
      - 'site_payload/**'
      - '.github/workflows/apply-email-content.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply updated Stitch content
        run: |
          cat site_payload/part_* > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.tgz
          tar -xzf /tmp/site.tgz -C .
          rm -rf site_payload
          rm -f .github/workflows/apply-email-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Align site content with Alon email and add English version"
          git push
