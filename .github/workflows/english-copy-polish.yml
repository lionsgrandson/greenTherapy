name: Polish production English copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/english-copy-polish.yml'

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add deliberate English copy overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          overrides = {
            'ישראל ישראלי': 'Dana Cohen',
            'משרד • טבע • אתר האירוע': 'Office • Outdoors • Event Venue',
            'במשרד, בטבע או באתר האירוע': 'At the Office, Outdoors, or at the Event Venue',
            'קבלת הצעה אישית': 'Get a Personal Quote',
            'קבלת הצעה לאירוע': 'Get an Event Quote',
            'קבלת הצעה לאירוע חברה': 'Get a Corporate Event Quote',
            'שליחת פנייה נוספת': 'Send Another Inquiry',
            'מנהל/ת רווחה ו-HR': 'HR / Employee Experience',
            'אחר': 'Other',
            'תודה. פרטי האירוע התקבלו ונוכל להמשיך משם להתאמה אישית.': 'Thanks. We received your event details and can continue with a tailored proposal.',
            'באתר האירוע שלכם': 'At Your Event Venue',
            'באתר האירוע שלכם.': 'At Your Event Venue.',
          }

          cache_path = Path('translations-he-en.json')
          cache = json.loads(cache_path.read_text(encoding='utf-8'))
          cache.update(overrides)
          cache_path.write_text(json.dumps(cache, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')

          p = Path('scripts/build_english_mirror.py')
          s = p.read_text(encoding='utf-8')
          anchor = "    'דף הבית': 'Home',\n"
          if anchor not in s:
              raise SystemExit('Could not locate override anchor')
          lines = ''.join(f"    {src!r}: {dst!r},\n" for src, dst in overrides.items())
          # Avoid duplicate insertion if this workflow is retried.
          if "'ישראל ישראלי': 'Dana Cohen'" not in s:
              s = s.replace(anchor, anchor + lines, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Rebuild English pages
        run: python3 scripts/build_english_mirror.py
      - name: Verify bad machine translations are gone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = list(Path('en').glob('*.html'))
          bad = ['Israel is an Israeli', 'Ministry • Teva • Event site', 'Receiving a personal offer', 'Receiving an offer for the event', 'Receiving an offer for a company event']
          for p in pages:
              s=p.read_text(encoding='utf-8')
              for phrase in bad:
                  if phrase in s:
                      raise SystemExit(f'{p}: bad translation remains: {phrase}')
          print('English copy spot-check passed')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/english-copy-polish.yml
          git config user.name "Moshe Schwartzberg"
          git config user.email "43815731+lionsgrandson@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Polish English production copy"
          git push
