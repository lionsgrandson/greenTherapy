name: Keep Stitch layout exact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-stitch.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync approved email content without changing Stitch structure
        run: |
          python - <<'PY'
          from pathlib import Path

          # Homepage: keep the original four-row treatment list so the Stitch card
          # retains exactly the same height/spacing, but use Alon's approved offerings.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          deep = '''<li class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[18px]">check</span>
          <span>עיסוי רקמות עמוק לשחרור עומס</span>
          </li>
          '''
          if deep not in s:
              raise SystemExit('Expected homepage deep-tissue row not found')
          s = s.replace(deep, '', 1)

          two_rows = '''<li class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[18px]">check</span>
          <span>עיסוי קרקפת ופנים מרגיע</span>
          </li>
          <li class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[18px]">check</span>
          <span>עיסוי כפות רגליים בסגנון תאילנדי</span>
          </li>'''
          merged = '''<li class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[18px]">check</span>
          <span>עיסוי קרקפת, פנים וכפות רגליים</span>
          </li>'''
          if two_rows not in s:
              raise SystemExit('Expected homepage scalp/foot rows not found')
          s = s.replace(two_rows, merged, 1)
          p.write_text(s, encoding='utf-8')

          # Pop-Up Spa: remove the extra card that was added after the Stitch export.
          # Fold the missing email content into existing cards so the original 3x2 grid,
          # section heights and visual rhythm remain unchanged.
          p = Path('spa.html')
          s = p.read_text(encoding='utf-8')
          inserted = '''<!-- Card 4: Thai & Shiatsu from approved Green Therapy content -->
          <div class="p-6 rounded-2xl bg-surface-container border border-outline-variant/30 flex flex-col justify-between">
          <div>
          <div class="flex items-center justify-between mb-4">
          <span class="p-2.5 rounded-lg bg-surface-bright text-tertiary">
          <span class="material-symbols-outlined text-2xl" data-icon="spa">spa</span>
          </span>
          <span class="text-xs px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-semibold">בהתאמה לאירוע</span>
          </div>
          <h3 class="font-headline-md text-headline-md font-bold text-on-surface mb-2">עיסוי תאילנדי ושיאצו</h3>
          <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                          טיפולים משחררים המשלבים מתיחות, לחיצות ועבודה מדויקת על עומסים בגוף. ניתן לשלב עיסוי תאילנדי ושיאצו כחלק מתפריט הטיפולים באירוע.
                        </p>
          </div>
          <div class="pt-6 mt-6 border-t border-outline-variant/20 flex items-center gap-2 text-on-surface-variant text-label-sm">
          <span class="material-symbols-outlined text-sm text-tertiary" data-icon="check_circle">check_circle</span>
          <span>חלק ממגוון הטיפולים של Green Therapy</span>
          </div>
          </div>
          <!-- Card 5 -->'''
          if inserted not in s:
              raise SystemExit('Expected added Spa card not found')
          s = s.replace(inserted, '<!-- Card 4 -->', 1)

          # Keep the existing compact treatment card but align it to the email wording.
          s = s.replace('עיסוי קרקפת, פנים וכפות רגליים', 'עיסוי קרקפת, פנים וכפות רגליים', 1)
          old_para = 'טיפול קצר ומרגיע הכולל עיסוי קרקפת ופנים, לצד עיסוי כפות רגליים אותנטי בהשראת המסורת התאילנדית. מתאים במיוחד להפוגה נעימה במהלך יום חברה או כנס.'
          if old_para not in s:
              raise SystemExit('Expected compact-treatment paragraph not found')
          # paragraph already approved; leave it unchanged

          # Repurpose the existing Tailored Treatment card instead of adding a seventh card.
          if 'טיפול משולב (Tailored Treatment)' not in s:
              raise SystemExit('Expected Tailored Treatment card not found')
          s = s.replace('טיפול משולב (Tailored Treatment)', 'עיסוי תאילנדי ושיאצו', 1)

          tailored_old = 'אנחנו לא עובדים לפי תבנית. המטפל מתאים את הטיפול בזמן אמת לצרכי העובד, ומשלב טכניקות שונות ליצירת טיפול מדויק ואפקטיבי.'
          tailored_new = 'טיפולים משחררים המשלבים מתיחות, לחיצות ועבודה מדויקת על עומסים בגוף. ניתן לשלב עיסוי תאילנדי ושיאצו כחלק מתפריט הטיפולים באירוע.'
          if tailored_old not in s:
              raise SystemExit('Expected Tailored Treatment paragraph not found')
          s = s.replace(tailored_old, tailored_new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html spa.html
          git diff --cached --quiet || git commit -m "Match Stitch layout while syncing email content"
          git push
