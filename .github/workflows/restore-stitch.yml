name: Restore Stitch design

on:
  push:
    branches: [main]
    paths:
      - 'stitch_payload/**'
      - '.github/workflows/restore-stitch.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original Stitch pages
        run: |
          cat stitch_payload/part_* > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.tgz
          tar -xzf /tmp/site.tgz -C .
          rm -rf stitch_payload
          rm -f styles.css script.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Restore original Stitch design and sync email content"
          git push
