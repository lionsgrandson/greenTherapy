name: Production release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release dependencies
        run: pip install beautifulsoup4 pillow
      - name: Apply client feedback and production hardening
        run: python scripts/production_release.py
      - name: Commit production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/production-release.yml
          git add -A
          git commit -m "Production-ready client feedback release"
          git push origin HEAD:main
