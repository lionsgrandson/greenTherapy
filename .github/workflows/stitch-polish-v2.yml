name: Apply final Stitch corrections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stitch-polish-v2.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/stitch_polish_v2.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/stitch-polish-v2.yml
          git add -A
          git commit -m "Finalize original Stitch design cleanup"
          git push origin HEAD:main
