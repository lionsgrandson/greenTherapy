name: Apply original Stitch polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stitch-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/stitch_polish.py
      - name: Commit polished static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/stitch-polish.yml
          git add -A
          git commit -m "Polish original Stitch design and behavior"
          git push origin HEAD:main
