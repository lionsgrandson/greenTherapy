name: Tidy generic Green Therapy labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tidy-generic-copy.yml'

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining generic labels
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('about.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<p class="font-headline-md text-headline-md text-forest-deep font-bold">מקצועיות</p>\n<p class="font-label-sm text-label-sm text-on-surface-variant">ל-HR ולחברות הפקה</p>', '<p class="font-headline-md text-headline-md text-forest-deep font-bold">אירועי חברה</p>\n<p class="font-label-sm text-label-sm text-on-surface-variant">במשרד, בטבע וב-Offsite</p>')
          p.write_text(s,encoding='utf-8')

          p=Path('en/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<h3 class="text-xl font-bold text-forest-deep mt-4">Experienced, Certified Team</h3>','')
          p.write_text(s,encoding='utf-8')

          p=Path('en/spa.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<h3 class="text-xl font-bold text-forest-deep mt-4">Top-Tier Therapists</h3>','')
          p.write_text(s,encoding='utf-8')

          p=Path('en/about.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<h3 class="text-xl font-bold text-forest-deep mt-4">High Service Standard</h3>','')
          p.write_text(s,encoding='utf-8')
          PY

          rm -f .github/workflows/tidy-generic-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Tidy generic labels across Hebrew and English pages"
          git push
