name: Final shared contact cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-shared-contact.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/remove_legacy_contact.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/final-shared-contact.yml
          git add -A
          git commit -m "Use one shared contact component across site"
          git push origin HEAD:main
