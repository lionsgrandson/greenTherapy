name: Final language and content cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-language-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean remaining language/content mismatches
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('en/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'title="וואטסאפ מהיר"': 'title="Email Green Therapy"',
            'alt="מתחם ספא חיצוני בטבע עם אמבטיית עץ ומיטות טיפולים יוקרתיות"': 'alt="Premium outdoor Green Therapy wellness setup in nature"',
            'alt="מתחם מיטות ספא חיצוני בטבע תחת מתחם טיפולים מעוצב"': 'alt="Outdoor pop-up spa massage setup in nature"',
            'alt="אמבטיית קרח יוקרתית חיצונית מוקפת עצי זית ומטפלים"': 'alt="Premium outdoor ice bath experience in a natural setting"',
            'alt="הדרכת עיסוי וסדנת וולנס אינטימית ומקצועית"': 'alt="Professional Green Therapy mind and body workshop"',
            'alt="מתחם ספא חיצוני עשיר עם אמבטיית עץ וצמחייה טבעית"': 'alt="Outdoor Green Therapy wellness setup surrounded by greenery"',
            'alt="מטפל מקצועי מבצע עיסוי משחרר בסביבה טבעית ומוארת"': 'alt="Professional therapist providing a relaxing massage in a natural setting"',
            'alt="תקריב ידיים של מטפל מוסמך מעניק עיסוי רקמות ממוקד"': 'alt="Certified therapist providing a professional massage"',
            'alt="פרגולת עץ מעוצבת עם תפאורה מעוצבת ומיטות טיפולים מגוהצות"': 'alt="Styled outdoor pergola with professional massage tables"',
            'alt="מטפל מנחה סדנת וולנס מודעת"': 'alt="Facilitator leading a corporate wellness workshop"',
            "alert('תודה! פנייתך התקבלה בהצלחה, נחזור אליך בהקדם.');": "alert('Thank you! Your inquiry was received successfully. We will get back to you soon.');",
            'placeholder="שם מלא / חברה"': 'placeholder="Full name / company"',
            'placeholder="טלפון ליצירת קשר"': 'placeholder="Contact phone"',
            '<span class="material-symbols-outlined text-[18px] text-primary-fixed">phone</span>\n<span dir="ltr">alongreentherapy@gmail.com</span>': '<span class="material-symbols-outlined text-[18px] text-primary-fixed">support_agent</span>\n<span>Corporate Event Inquiries</span>',
            '<li><a class="hover:text-mint-mist transition-colors" href="#ice-baths">Workshops &amp; Ice Baths</a></li>': '<li><a class="hover:text-mint-mist transition-colors" href="#ice-baths">Ice Bath &amp; Cold Exposure Experience</a></li>',
            '<!-- 5. Why Green Therapy (למה חברות בוחרות ב-Green Therapy?) -->': '<!-- 5. Why Green Therapy -->',
            '<!-- 6. How It Works (תהליך עבודה ב-3 שלבים) -->': '<!-- 6. How It Works -->',
            '<!-- 7. Real Events Gallery (גלריית אירועים אמיתיים - Mosaic Layout) -->': '<!-- 7. Real Events Gallery -->',
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing expected English-page text: {old[:80]}')
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Remove one leftover unsupported service label while preserving the Stitch footer layout.
          p = Path('spa.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Sauna &amp; Ice Bath', 'Ice Bath Experience')
          p.write_text(s, encoding='utf-8')

          # Keep image accessibility copy aligned with the actual offered experience.
          p = Path('ice-bath.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
            'A lush outdoor corporate retreat lounge with rustic wooden massage tables lined under a pergola, draped with soft linen fabrics, and an adjacent steaming outdoor cedarwood sauna barrel. The scene captures pure Mediterranean nature relaxation, golden hour soft light, aromatic herbal elements, and premium corporate hospitality.',
            'A lush outdoor corporate wellness retreat with rustic massage tables under a pergola, soft linens, natural greenery, and premium event styling.'
          )
          p.write_text(s, encoding='utf-8')

          # Clean an obsolete internal design comment; no visual change.
          p = Path('gallery.html')
          s = p.read_text(encoding='utf-8').replace('<!-- Card 3: Deep Tissue & Targeted Care (4 Cols) -->', '<!-- Card 3: Mind & Body Experience (4 Cols) -->')
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/final-language-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finish English localization and content cleanup"
          git push
