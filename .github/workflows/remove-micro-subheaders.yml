name: Remove micro subheaders and sync language links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-micro-subheaders.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean heading eyebrows and language links
        run: |
          python -m pip install --quiet beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag

          root_pages = ['index.html','spa.html','ice-bath.html','workshops.html','healthy-bar.html','about.html','gallery.html','contact.html']

          def remove_eyebrows(soup):
              # Remove small decorative labels/chips immediately preceding real headings.
              for heading in list(soup.find_all(['h1','h2','h3'])):
                  prev = heading.find_previous_sibling()
                  if not isinstance(prev, Tag):
                      continue
                  classes = set(prev.get('class') or [])
                  child_classes = set()
                  for c in prev.find_all(True, recursive=True):
                      child_classes.update(c.get('class') or [])
                  is_chip = ('inline-flex' in classes and any(x.startswith('rounded') for x in classes))
                  is_label = any(x in classes or x in child_classes for x in ['font-label-sm','font-label-caps','text-label-sm','text-label-caps'])
                  has_tracking = any(x.startswith('tracking-') for x in classes | child_classes) or 'uppercase' in classes | child_classes
                  if is_chip and (is_label or len(prev.get_text(' ',strip=True)) < 100):
                      prev.decompose()
                  elif prev.name == 'span' and is_label and has_tracking:
                      prev.decompose()

              # Remove the exact rejected copy anywhere outside brand/footer content.
              rejected = {
                  'אודות Green Therapy • הפקת מתחמי Wellness לאירועי חברה',
                  'הסטנדרט שמבדיל אותנו',
                  'צוות Green Therapy',
                  'מקצועיות ושירות',
                  'צוות מנוסה, מוסמך ושירותי ברמה הגבוהה ביותר',
              }
              for node in list(soup.find_all(string=lambda x: isinstance(x,str) and x.strip() in rejected)):
                  if node.find_parent('header') or node.find_parent('footer'):
                      continue
                  el = node.parent
                  parent = el.parent if el else None
                  if isinstance(parent, Tag) and ('inline-flex' in (parent.get('class') or []) or 'absolute' in (parent.get('class') or [])):
                      parent.decompose()
                  elif el:
                      el.decompose()

          for page in root_pages:
              p = Path(page)
              soup = BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
              remove_eyebrows(soup)

              # Make the Hebrew nav visually neutral except for hover; avoid every link looking active.
              header = soup.find('header')
              if header:
                  nav = header.find('nav')
                  if nav:
                      for a in nav.find_all('a'):
                          a['class'] = ['text-on-surface-variant','font-medium','hover:text-primary','transition-colors','duration-300','font-label-md','text-label-md']

                  # Language switch goes to matching English page.
                  switch = header.find('a', attrs={'data-lang-switch': True})
                  if switch:
                      switch['href'] = 'en/' + page

              p.write_text(str(soup),encoding='utf-8')

          # Do the same eyebrow cleanup in English pages and make HE switch point back to matching Hebrew page.
          en_dir = Path('en')
          for p in en_dir.glob('*.html'):
              soup = BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
              remove_eyebrows(soup)
              header = soup.find('header')
              if header:
                  for a in header.find_all('a', href=True):
                      if a.get_text(' ',strip=True) == 'HE':
                          a['href'] = '../' + p.name
              p.write_text(str(soup),encoding='utf-8')

          # Keep real recommendation screenshots crisp by not enlarging the compact source files too far.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8').replace('max-w-[330px]', 'max-w-[180px]')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/remove-micro-subheaders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove micro subheaders and finish bilingual navigation"
          git push
