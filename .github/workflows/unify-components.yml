name: Unify shared components and translation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-components.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/unify_shared_components.py
      - name: Commit unified site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/unify-components.yml
          git add -A
          git commit -m "Unify header contact FAQ and translations"
          git push origin HEAD:main
