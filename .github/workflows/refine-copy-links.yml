name: Refine Green Therapy copy and links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-copy-links.yml'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine copy and internal links
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the generic team heading while keeping the factual paragraph below it.
          s = s.replace('<h3 class="font-headline-md text-[20px] font-bold text-forest-deep mb-3">צוות מקצועי ומוסמך</h3>\n', '')

          # Remove small decorative micro-label rows from the four value cards.
          blocks = [
          '''<div class="mt-6 pt-4 border-t border-outline-variant/20 flex items-center gap-1.5 text-terracotta font-label-sm font-semibold">\n<span>Turnkey Solution</span>\n<span class="material-symbols-outlined text-[16px]">check_circle</span>\n</div>\n''',
          '''<div class="mt-6 pt-4 border-t border-outline-variant/20 flex items-center gap-1.5 text-terracotta font-label-sm font-semibold">\n<span>מקצועיות ללא פשרות</span>\n<span class="material-symbols-outlined text-[16px]">verified_user</span>\n</div>\n''',
          '''<div class="mt-6 pt-4 border-t border-outline-variant/20 flex items-center gap-1.5 text-terracotta font-label-sm font-semibold">\n<span>גמישות והתאמה אישית</span>\n<span class="material-symbols-outlined text-[16px]">category</span>\n</div>\n''',
          '''<div class="mt-6 pt-4 border-t border-outline-variant/20 flex items-center gap-1.5 text-primary font-label-sm font-semibold">\n<span>שקט ניהולי</span>\n<span class="material-symbols-outlined text-[16px]">touch_app</span>\n</div>\n'''
          ]
          for block in blocks:
              s = s.replace(block, '')

          # Replace generic hero trust language with concrete service information.
          s = s.replace('<span>מטפלים ומנחים מוסמכים</span>', '<span>5 סוגי עיסוי לבחירה</span>')

          # Service CTAs should lead to the actual service pages, not only the contact page.
          s = s.replace('href="contact.html">\n<span>למתחם העיסויים לאירוע שלכם</span>', 'href="spa.html">\n<span>למתחם העיסויים לאירוע שלכם</span>')
          s = s.replace('href="contact.html">\n<span>לחוויית אמבטיות הקרח לאירוע</span>', 'href="ice-bath.html">\n<span>לחוויית אמבטיות הקרח לאירוע</span>')
          s = s.replace('href="contact.html">\n<span>לסדנאות ולהרצאות</span>', 'href="workshops.html">\n<span>לסדנאות ולהרצאות</span>')
          s = s.replace('href="contact.html">\n<span>לדוכני הבריאות והאירוח</span>', 'href="healthy-bar.html">\n<span>לדוכני הבריאות והאירוח</span>')
          p.write_text(s, encoding='utf-8')

          # Remove the generic image badge from About.
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          badge = '''<div class="absolute bottom-4 right-4 bg-forest-deep/85 backdrop-blur-md text-surface-bone px-4 py-2.5 rounded-lg text-sm flex items-center gap-2">\n<span class="material-symbols-outlined text-mint-mist">verified_user</span>\n<span class="font-label-md text-label-md">צוות מקצועי ומוסמך</span>\n</div>\n'''
          s = s.replace(badge, '')
          p.write_text(s, encoding='utf-8')

          # Make the third Spa metric concrete instead of generic.
          p = Path('spa.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<span class="block font-headline-md text-headline-md font-bold text-tertiary">מוסמכים</span>\n</div>', '<span class="block font-headline-md text-headline-md font-bold text-tertiary">5 טיפולים</span>\n<span class="font-label-sm text-label-sm text-on-surface-variant">לבחירה</span>\n</div>')
          # Existing related-service title now links directly to the Ice Bath page.
          s = s.replace('<h3 class="font-headline-md text-headline-md font-bold text-on-surface mb-2">שילוב סדנת אמבטיות קרח</h3>', '<h3 class="font-headline-md text-headline-md font-bold text-on-surface mb-2"><a class="hover:text-primary transition-colors" href="ice-bath.html">שילוב סדנת אמבטיות קרח</a></h3>')
          p.write_text(s, encoding='utf-8')

          # Cross-link Ice Baths back to the Spa page.
          p = Path('ice-bath.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('שלבו אמבטיות קרח עם מתחם העיסויים', 'שלבו אמבטיות קרח עם <a class="text-primary hover:underline" href="spa.html">מתחם העיסויים</a>')
          p.write_text(s, encoding='utf-8')

          # Link service names in the Healthy Bar combination section.
          p = Path('healthy-bar.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('שילוב חבילות: בר בריאות + עיסויים / אמבטיות קרח', 'שילוב חבילות: בר בריאות + <a class="text-primary hover:underline" href="spa.html">עיסויים</a> / <a class="text-primary hover:underline" href="ice-bath.html">אמבטיות קרח</a>')
          p.write_text(s, encoding='utf-8')

          # English homepage: make the four experience CTAs point to their actual pages when present.
          p = Path('en/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'href="contact.html">Explore the Pop-Up Spa': 'href="spa.html">Explore the Pop-Up Spa',
              'href="contact.html">Explore the Ice Bath Experience': 'href="ice-bath.html">Explore the Ice Bath Experience',
              'href="contact.html">Explore Workshops &amp; Keynotes': 'href="workshops.html">Explore Workshops &amp; Keynotes',
              'href="contact.html">Explore the Healthy Bar': 'href="healthy-bar.html">Explore the Healthy Bar',
          }
          for old,new in replacements.items():
              s = s.replace(old,new)
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/refine-copy-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove generic labels, add greener surfaces and internal links"
          git push
